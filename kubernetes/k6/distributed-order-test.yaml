
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: distributed-order-test
  namespace: performance
spec:
  parallelism: 4
  separate: false

  script:
    localFile: /work/tests/load/order-workload.js

  runner:
    image: dpe-k6-runner:v1
    imagePullPolicy: Never
    env:
      - name: ENV
        value: k8s
      - name: PROFILE
        value: distributed
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi

  initializer:
    image: dpe-k6-runner:v1
    imagePullPolicy: Never
    env:
      - name: ENV
        value: k8s
      - name: PROFILE
        value: distributed
